name: Trigger CircleCI Pipelines
permissions:
  contents: read
on:
  push:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: check
        run: |
          BASE="${{ github.event.before }}"
          git cat-file -e "$BASE^{commit}" 2>/dev/null || BASE=HEAD~1
          CHANGED=$(git diff --name-only "$BASE" HEAD)

          # Changed admin frontend files incl. admin plugins of packages and the npm workspace root,
          # and packages (or root files) without docs and frontend files
          FRONTEND='^(package(-lock)?\.json$|admin/((js|cypress|dist|i18n|public)/|index\.html$|package|[^/]*\.m?js$)|[^/]+/admin/)'
          ADMIN=$(echo "$CHANGED" | grep -E "$FRONTEND" || true)
          DIRS=$(echo "$CHANGED" | grep -vE "\.md$|$FRONTEND" \
            | sed -E 's#^(themes/[^/]+|[^/]+)/.*#\1#' | sort -u || true)

          # Optional packages run their own tests from phpunit.xml, everything else runs all
          TESTS=""
          for d in $DIRS; do
            if [ "$d" = core ] || [ "$d" = theme ] || [ ! -f "$d/composer.json" ]; then TESTS=ALL; break; fi
            if grep -q "<directory>./$d/tests/</directory>" phpunit.xml; then TESTS="${TESTS:+$TESTS }$d/tests"; fi
          done

          # Admin component test folders, shared frontend code runs all
          ADMIN_TESTS=""
          for f in $ADMIN; do
            case "$f" in
              admin/dist/*|admin/cypress/e2e/*) continue ;;
              */admin/*) a=${f%%/*} ;;
              admin/js/fields/*|admin/js/components/*|admin/js/views/*) a=$(echo "$f" | cut -d/ -f3) ;;
              admin/cypress/unit/*/*) a=$(echo "$f" | cut -d/ -f4) ;;
              admin/cypress/unit/*) a=root ;;
              *) ADMIN_TESTS=ALL; break ;;
            esac
            case " $ADMIN_TESTS " in *" $a "*) ;; *) ADMIN_TESTS="${ADMIN_TESTS:+$ADMIN_TESTS }$a" ;; esac
          done

          echo "run_php=$([ -n "$DIRS" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "run_perf=$(echo "$DIRS" | grep -qxE 'core|graphql|jsonapi|mcp|search|theme' && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "run_admin=$([ -n "$ADMIN" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "tests=$TESTS" >> $GITHUB_OUTPUT
          echo "admin_tests=$ADMIN_TESTS" >> $GITHUB_OUTPUT

      - name: Trigger CircleCI PHP pipeline
        if: steps.check.outputs.run_php == 'true'
        run: |
          jq -n --arg branch "${{ github.ref_name }}" --arg tests "$TESTS" --argjson perf "$RUN_PERF" \
            '{branch: $branch, parameters: {run_php: true, run_perf: $perf, tests: $tests}}' |
          curl -s -X POST \
            "https://circleci.com/api/v2/project/gh/aimeos/pagible/pipeline" \
            -H "Circle-Token: $CCI_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
          RUN_PERF: ${{ steps.check.outputs.run_perf }}
          TESTS: ${{ steps.check.outputs.tests }}

      - name: Trigger CircleCI admin pipeline
        if: steps.check.outputs.run_admin == 'true'
        run: |
          jq -n --arg branch "${{ github.ref_name }}" --arg tests "$ADMIN_TESTS" \
            '{branch: $branch, parameters: {run_admin: true, admin_tests: $tests}}' |
          curl -s -X POST \
            "https://circleci.com/api/v2/project/gh/aimeos/pagible/pipeline" \
            -H "Circle-Token: $CCI_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-
        env:
          CCI_TOKEN: ${{ secrets.CCI_TOKEN }}
          ADMIN_TESTS: ${{ steps.check.outputs.admin_tests }}
