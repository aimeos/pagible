"UTC date and time in ISO 8601 format, which browsers don't mistake for their local time"
scalar CmsWebhookDateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTimeUtc")

"A tenant-scoped outbound webhook subscription"
type CmsWebhook {
  id: ID!
  status: Boolean!
  "Optional name to tell subscriptions apart"
  name: String!
  "URL without the query string and the last path segment, which may contain credentials"
  endpoint: String!
  events: [String!]!
  last_error: CmsWebhookError @method(name: "failure")
  last_success_at: CmsWebhookDateTime
  "Deliveries are paused until then after consecutive temporary failures"
  paused_until: CmsWebhookDateTime
  editor: String!
  created_at: CmsWebhookDateTime
  updated_at: CmsWebhookDateTime
}

"Last delivery error of a subscription"
type CmsWebhookError {
  "Reason code, invalid_encryption if the secret can't be decrypted with the application keys"
  reason: String!
  "HTTP status of the response"
  status: Int
  "Time of the failure"
  at: CmsWebhookDateTime
}

"A newly generated secret; it is returned by this mutation response only"
type CmsWebhookProvisioning {
  webhook: CmsWebhook!
  secret: String!
}

"Delivery status of the server for all subscriptions"
type CmsWebhookServer {
  "Webhooks are enabled by the server configuration"
  enabled: Boolean!
  "Reason why all deliveries are blocked by the server configuration"
  blocked: String
}

"Result of a test event sent to a subscription"
type CmsWebhookPing {
  success: Boolean!
  status: Int
  reason: String
}

input CmsWebhookAddInput {
  url: String! @rules(apply: ["max:500"])
  name: String = "" @rules(apply: ["max:100"])
  events: [String!]! @rulesForArray(apply: ["min:1", "max:100"])
  status: Boolean = false
}

input CmsWebhookSaveInput {
  events: [String!]! @rulesForArray(apply: ["min:1", "max:100"])
  status: Boolean!
  "The current name is kept if it's omitted and removed if it's empty or null"
  name: String @rules(apply: ["max:100"])
}

extend type Query {
  cmsWebhooks: [CmsWebhook!]!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@search")

  cmsWebhookEvents: [String!]!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@names")

  cmsWebhookServer: CmsWebhookServer!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@server")
}

extend type Mutation {
  addWebhook(input: CmsWebhookAddInput!): CmsWebhookProvisioning!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@add")

  saveWebhook(id: ID!, input: CmsWebhookSaveInput!): CmsWebhook!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@save")

  rotateWebhook(id: ID!): CmsWebhookProvisioning!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@rotate")

  pingWebhook(id: ID!): CmsWebhookPing!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@ping")

  # Same maximum as WebhookManager::PURGE_MAX and the batches purged by the admin panel
  purgeWebhook(id: [ID!]! @rulesForArray(apply: ["min:1", "max:100"])): Int!
    @guard @cmsPermission(action: "config:webhook") @throttle(name: "cms-graphql")
    @field(resolver: "\\Aimeos\\Cms\\GraphQL\\Resolvers\\WebhookResolver@purge")
}
