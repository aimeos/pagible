# PHP CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-php/ for more details
#
version: 2.1

parameters:
  run_php:
    type: boolean
    default: false
  run_perf:
    type: boolean
    default: false
  run_admin:
    type: boolean
    default: false
  tests:
    type: string
    default: "ALL"
  admin_tests:
    type: string
    default: "ALL"

commands:
  skip-without-tests:
    steps:
      - run:
          name: Skip if no tests are affected
          command: if [ -z "<< pipeline.parameters.tests >>" ]; then circleci-agent step halt; fi
  skip-without-perf:
    steps:
      - run:
          name: Skip if no benchmarks are affected
          command: if [ "<< pipeline.parameters.run_perf >>" != "true" ]; then circleci-agent step halt; fi
  phpunit:
    steps:
      - run: TESTS="<< pipeline.parameters.tests >>"; ./vendor/bin/phpunit ${TESTS#ALL}

jobs:
  "php82-sqlite3":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: sqlite
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - phpunit

  "php82-mariadb10":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: mariadb
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mariadb:10
        environment:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_USER: pagible
          MARIADB_PASSWORD: pagible
          MARIADB_DATABASE: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php82-mysql8":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: mysql
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mysql:8
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: pagible
          MYSQL_PASSWORD: pagible
          MYSQL_DATABASE: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php82-pgsql14":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: pgsql
          DB_HOST: "127.0.0.1"
          DB_PORT: 5432
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: postgres:14
        environment:
          POSTGRES_PASSWORD: pagible
          POSTGRES_USER: pagible
          POSTGRES_DB: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 5432 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php82-mssql17":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: sqlsrv
          DB_HOST: "127.0.0.1"
          DB_PORT: 1433
          DB_USERNAME: SA
          DB_PASSWORD: S3c0r3P4ss
          DB_DATABASE: cms
      - image: aimeos/ci-mssql-fts:2017
        environment:
          SA_PASSWORD: S3c0r3P4ss
          ACCEPT_EULA: Y
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: echo "CREATE DATABASE cms;" > sqlserver.sql; for i in `seq 1 10`; do /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U SA -P 'S3c0r3P4ss' -i sqlserver.sql && exit 0; sleep 3; done
      - phpunit

  "php85-sqlite":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: sqlite
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - phpunit

  "php85-mariadb":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: mariadb
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mariadb:latest
        environment:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_USER: pagible
          MARIADB_PASSWORD: pagible
          MARIADB_DATABASE: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php85-mysql":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: mysql
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mysql:latest
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: pagible
          MYSQL_PASSWORD: pagible
          MYSQL_DATABASE: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php85-pgsql":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: pgsql
          DB_HOST: "127.0.0.1"
          DB_PORT: 5432
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: postgres:18
        environment:
          POSTGRES_PASSWORD: pagible
          POSTGRES_USER: pagible
          POSTGRES_DB: cms
    steps:
      - checkout
      - skip-without-tests
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 5432 && echo OK && exit 0; echo -n .; sleep 1; done
      - phpunit

  "php85-phpstan":
    docker:
      - image: aimeos/ci-php:8.5
    steps:
      - checkout
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: ./vendor/bin/phpstan --no-progress

  "webhook-test":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: sqlite
    working_directory: ~/project/webhooks
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - webhooks-php85-{{ checksum "composer.json" }}
      - run:
          name: Install isolated webhook package
          command: |
            composer config repositories.admin '{"type":"path","url":"../admin","options":{"symlink":false}}'
            composer config repositories.core '{"type":"path","url":"../core","options":{"symlink":false}}'
            composer config repositories.graphql '{"type":"path","url":"../graphql","options":{"symlink":false}}'
            composer config minimum-stability dev
            composer config prefer-stable true
            composer update -n --prefer-dist
      - save_cache:
          key: webhooks-php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: ./vendor/bin/phpunit
      - run: ./vendor/bin/phpstan analyze --no-progress

  "cashier-provider":
    parameters:
      package:
        type: string
      php:
        type: string
    docker:
      - image: aimeos/ci-php:<< parameters.php >>
    working_directory: ~/project/<< parameters.package >>
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install isolated provider
          command: |
            composer config repositories.cashier '{"type":"path","url":"../cashier","options":{"symlink":false}}'
            composer config repositories.core '{"type":"path","url":"../core","options":{"symlink":false}}'
            composer config minimum-stability dev
            composer config prefer-stable true
            composer update -n --prefer-dist
      - run: ./vendor/bin/phpunit
      - run: ./vendor/bin/phpstan analyze --no-progress

  "admin-lint":
    docker:
      - image: cimg/node:lts
    working_directory: ~/project/admin
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - admin-{{ checksum "../package-lock.json" }}
      - run: npm ci --cache ~/.npm --prefix ..
      - save_cache:
          key: admin-{{ checksum "../package-lock.json" }}
          paths:
            - ~/.npm
      - run: npx eslint
      - run:
          name: Lint and build admin plugins
          command: for d in ../*/admin; do (cd "$d" && npm run lint && npm run build) || exit 1; done

  "admin-unit":
    docker:
      - image: cypress/browsers:latest
    working_directory: ~/project/admin
    parallelism: 3
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Select component tests
          command: |
            case $CIRCLE_NODE_INDEX in
              0) DIRS="fields" ;;
              1) DIRS="components" ;;
              2) DIRS="root assets js views $(cd .. && ls -d */admin | cut -d/ -f1)" ;;
            esac
            SPECS=""
            for d in $DIRS; do
              case " << pipeline.parameters.admin_tests >> " in " ALL "|*" $d "*) ;; *) continue ;; esac
              case $d in
                root) p="cypress/unit/*.cy.{js,ts}" ;;
                *) if [ -d "../$d/admin" ]; then p="../$d/admin/cypress/unit/**/*.cy.{js,ts}"; else p="cypress/unit/$d/**/*.cy.{js,ts}"; fi ;;
              esac
              SPECS="${SPECS:+$SPECS,}$p"
            done
            if [ -z "$SPECS" ]; then circleci-agent step halt; fi
            echo "export SPECS='$SPECS'" >> "$BASH_ENV"
      - restore_cache:
          keys:
            - admin-cypress-{{ checksum "../package-lock.json" }}
      - run: npm ci --cache ~/.npm --prefix ..
      - save_cache:
          key: admin-cypress-{{ checksum "../package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache/Cypress
      # pre-bundled Vite dependencies, a cold cache can re-bundle mid-run and fail loading a spec
      - restore_cache:
          keys:
            - admin-vite-{{ checksum "../package-lock.json" }}-{{ checksum "vite.config.js" }}
      - run:
          name: Run component tests
          command: npx cypress run --component --spec "$SPECS"
      - save_cache:
          key: admin-vite-{{ checksum "../package-lock.json" }}-{{ checksum "vite.config.js" }}
          paths:
            - node_modules/.vite

  "admin-e2e":
    docker:
      - image: cypress/browsers:latest
    working_directory: ~/project/admin
    parallelism: 4
    steps:
      - checkout:
          path: ~/project
      - restore_cache:
          keys:
            - admin-cypress-{{ checksum "../package-lock.json" }}
      - run: npm ci --cache ~/.npm --prefix ..
      - save_cache:
          key: admin-cypress-{{ checksum "../package-lock.json" }}
          paths:
            - ~/.npm
            - ~/.cache/Cypress
      - run: npm run build
      - run: |
          SPECS="$(circleci tests glob 'cypress/e2e/**/*.cy.{js,ts}' | circleci tests split --split-by=timings)"
          SPECS="$(printf '%s\n' "$SPECS" | paste -sd ',' - | sed 's/,$//')"
          if [ -z "$SPECS" ]; then
            echo "No e2e specs were assigned to this container; running full e2e suite"
            SPECS="cypress/e2e/**/*.cy.{js,ts}"
          fi
          npx start-server-and-test preview http://localhost:4173 \
            "npx cypress run --spec \"$SPECS\""
      - store_artifacts:
          path: cypress

  "perf-sqlite":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: sqlite
    steps:
      - checkout
      - skip-without-perf
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: ./vendor/bin/phpunit --group benchmark

  "perf-mariadb":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: mariadb
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mariadb:latest
        environment:
          MARIADB_ROOT_PASSWORD: rootpw
          MARIADB_USER: pagible
          MARIADB_PASSWORD: pagible
          MARIADB_DATABASE: cms
    steps:
      - checkout
      - skip-without-perf
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - run: ./vendor/bin/phpunit --group benchmark

  "perf-mysql":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: mysql
          DB_HOST: "127.0.0.1"
          DB_PORT: 3306
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: mysql:latest
        # index dives misestimate rows after the rolled back bulk deletes of the benchmarks
        command: --eq-range-index-dive-limit=1
        environment:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: pagible
          MYSQL_PASSWORD: pagible
          MYSQL_DATABASE: cms
    steps:
      - checkout
      - skip-without-perf
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 3306 && echo OK && exit 0; echo -n .; sleep 1; done
      - run: ./vendor/bin/phpunit --group benchmark

  "perf-pgsql":
    docker:
      - image: aimeos/ci-php:8.5
        environment:
          DB_DRIVER: pgsql
          DB_HOST: "127.0.0.1"
          DB_PORT: 5432
          DB_USERNAME: pagible
          DB_PASSWORD: pagible
          DB_DATABASE: cms
      - image: postgres:18
        environment:
          POSTGRES_PASSWORD: pagible
          POSTGRES_USER: pagible
          POSTGRES_DB: cms
    steps:
      - checkout
      - skip-without-perf
      - restore_cache:
          keys:
            - php85-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php85-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: for i in `seq 1 10`; do nc -z 127.0.0.1 5432 && echo OK && exit 0; echo -n .; sleep 1; done
      - run: ./vendor/bin/phpunit --group benchmark

  "perf-mssql":
    docker:
      - image: aimeos/ci-php:8.2
        environment:
          DB_DRIVER: sqlsrv
          DB_HOST: "127.0.0.1"
          DB_PORT: 1433
          DB_USERNAME: SA
          DB_PASSWORD: S3c0r3P4ss
          DB_DATABASE: cms
      - image: aimeos/ci-mssql-fts:2017
        environment:
          SA_PASSWORD: S3c0r3P4ss
          ACCEPT_EULA: Y
    steps:
      - checkout
      - skip-without-perf
      - restore_cache:
          keys:
            - php82-{{ checksum "composer.json" }}
      - run: composer update -n --prefer-dist
      - save_cache:
          key: php82-{{ checksum "composer.json" }}
          paths: [./vendor]
      - run: echo "CREATE DATABASE cms;" > sqlserver.sql; for i in `seq 1 10`; do /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U SA -P 'S3c0r3P4ss' -i sqlserver.sql && exit 0; sleep 3; done
      - run: ./vendor/bin/phpunit --group benchmark

workflows:
  version: 2
  php:
    when: << pipeline.parameters.run_php >>
    jobs:
      - "php85-phpstan"
      - "webhook-test":
          requires: ["php85-phpstan"]
      - "cashier-provider":
          matrix:
            parameters:
              package: ["cashier-stripe", "cashier-paddle", "cashier-mollie"]
              php: ["8.2", "8.3", "8.4", "8.5"]
          requires: ["php85-phpstan"]
      - "php82-sqlite3":
          requires: ["php85-phpstan"]
      - "php82-mariadb10":
          requires: ["php85-phpstan"]
      - "php82-mysql8":
          requires: ["php85-phpstan"]
      - "php82-pgsql14":
          requires: ["php85-phpstan"]
      - "php82-mssql17":
          requires: ["php85-phpstan"]
      - "php85-sqlite":
          requires: ["php85-phpstan"]
      - "php85-mariadb":
          requires: ["php85-phpstan"]
      - "php85-mysql":
          requires: ["php85-phpstan"]
      - "php85-pgsql":
          requires: ["php85-phpstan"]
      - "perf-sqlite":
          requires: ["php82-sqlite3", "php85-sqlite"]
      - "perf-mariadb":
          requires: ["php82-mariadb10", "php85-mariadb"]
      - "perf-mysql":
          requires: ["php82-mysql8", "php85-mysql"]
      - "perf-pgsql":
          requires: ["php82-pgsql14", "php85-pgsql"]
      - "perf-mssql":
          requires: ["php82-mssql17"]
  admin:
    when: << pipeline.parameters.run_admin >>
    jobs:
      - "admin-lint"
      - "admin-unit":
          requires: ["admin-lint"]
      - "admin-e2e":
          requires: ["admin-lint"]
